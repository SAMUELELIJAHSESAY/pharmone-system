<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f766e" />
  <title>PharmaCare — Offline</title>
  <style>
    :root { color-scheme: light dark; font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0f172a; color: #f8fafc; padding: 24px; }
    main { width: min(100%, 440px); background: #ffffff; color: #0f172a; border-radius: 20px; padding: 28px; text-align: center; box-shadow: 0 24px 60px rgba(0,0,0,.3); }
    .icon { width: 72px; height: 72px; margin: 0 auto 18px; display: grid; place-items: center; border-radius: 20px; background: #0f766e; color: white; font-size: 38px; }
    h1 { margin: 0 0 8px; font-size: 1.5rem; }
    p { margin: 0 0 20px; color: #475569; line-height: 1.6; }
    button { border: 0; border-radius: 10px; padding: 12px 18px; width: 100%; min-height: 48px; background: #0f766e; color: white; font: inherit; font-weight: 700; cursor: pointer; }
    small { display: block; margin-top: 14px; color: #64748b; }
  </style>
</head>
<body>
  <main>
    <div class="icon" aria-hidden="true">⚕</div>
    <h1>You’re offline</h1>
    <p>PharmaCare is installed, but live pharmacy data and secure account operations require an internet connection. Reconnect, then try again.</p>
    <button type="button" onclick="location.reload()">Try again</button>
    <small>This screen does not create or change pharmacy records.</small>
  </main>
  <script>
    window.addEventListener('online', () => location.reload(), { once: true });
  </script>
</body>
</html>
