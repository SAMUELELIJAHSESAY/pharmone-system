<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#2563eb" />
  <title>SamMia Pharm — Offline</title>
  <style>
    :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f8fafc; color: #0f172a; padding: 24px; }
    main { width: min(100%, 440px); background: #ffffff; border: 1px solid #e5e7eb; border-radius: 20px; padding: 30px; text-align: center; box-shadow: 0 24px 60px rgba(15,45,91,.12); }
    .icon { width: 76px; height: 76px; margin: 0 auto 18px; display: grid; place-items: center; border-radius: 20px; background: #eff6ff; }
    .icon img { width: 58px; height: 58px; }
    h1 { margin: 0 0 8px; font-size: 1.55rem; color: #0f2d5b; }
    p { margin: 0 0 20px; color: #64748b; line-height: 1.6; }
    button { border: 0; border-radius: 10px; padding: 12px 18px; width: 100%; min-height: 48px; background: #2563eb; color: white; font: inherit; font-weight: 700; cursor: pointer; }
    small { display: block; margin-top: 14px; color: #64748b; }
  </style>
</head>
<body>
  <main>
    <div class="icon" aria-hidden="true"><img src="/brand/sammia-mark.png" alt="" /></div>
    <h1>You’re offline</h1>
    <p>SamMia Pharm is installed, but live pharmacy data and secure account operations require an internet connection. Reconnect, then try again.</p>
    <button type="button" onclick="location.reload()">Try again</button>
    <small>This screen does not create or change pharmacy records.</small>
  </main>
  <script>
    window.addEventListener('online', () => location.reload(), { once: true });
  </script>
</body>
</html>
